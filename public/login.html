<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sign in · Connect &amp; Activate</title>
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="/styles.css?v=6">
</head>
<body class="login">
<div class="login-wrap">
  <div class="login-card" id="card">
    <div class="login-brand" id="brand"></div>
    <h1>Sign in</h1>
    <p>Submit broadband connection orders, follow them to activation and work the ones that are held.</p>
    <div id="accounts"></div>
    <form id="pw" class="stack" autocomplete="on">
      <label class="field"><span>Email</span><input type="email" name="email" autocomplete="username" required></label>
      <label class="field"><span>Password</span><input type="password" name="password" autocomplete="current-password" required></label>
      <div id="err" class="alert bad" hidden></div>
      <button class="btn primary block" type="submit">Sign in</button>
    </form>
  </div>
  <p class="login-foot"><b>Connect &amp; Activate</b> · Orbit Telecom Order Operations</p>
</div>
<script src="/common.js?v=6"></script>
<script src="/login.js?v=6"></script>
</body>
</html>
